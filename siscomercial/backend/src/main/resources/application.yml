spring:
  application:
    name: siscomercial-ecommerce

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# Perfil LOCAL - roda sem depender do Supabase, usando H2 em memória.
# Use este perfil para testar o backend e o agente de IA rapidamente.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:siscomercial;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Perfil SUPABASE - producao / homologacao
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

---
siscomercial:
  ia:
    # Chave da API do provedor de LLM usado pelo LangChain4j (ex: OpenAI).
    # Deixe em branco para rodar com o agente em modo "stub" (sem chamar LLM real).
    openai-api-key: ${OPENAI_API_KEY:}
    modelo: gpt-4o-mini
    # Operacoes que o agente pode executar sem pedir confirmacao ao administrador
    operacoes-sem-confirmacao:
      - consultarPedido
      - consultarProduto
      - consultarEstoque
      - consultarStatusNotaFiscal
    # Operacoes que SEMPRE exigem confirmacao explicita antes de executar
    operacoes-com-confirmacao:
      - cancelarPedido
      - emitirNotaFiscal
      - enviarDocumentoWhatsApp

  frete:
    provedor: stub # RN: provedor de frete ainda "a definir" na especificacao

  fiscal:
    provedor: stub # provedor de NF-e ainda "a definir" na especificacao

  whatsapp:
    provedor: stub # provedor de WhatsApp ainda "a definir" na especificacao

  estoque:
    reserva-minutos-expiracao: 15 # valor default; especificacao marca isso como "a definir"
