spring:
  application:
    name: siscomercial-ecommerce

  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5432/siscomercial
    username: postgres
    password: gjrv0907
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

---
siscomercial:
  marketplace:
    crypto-key: ${MARKETPLACE_CRYPTO_KEY:}

  mercado-livre:
    client-id: ${MERCADO_LIVRE_CLIENT_ID:}
    client-secret: ${MERCADO_LIVRE_CLIENT_SECRET:}
    redirect-uri: ${MERCADO_LIVRE_REDIRECT_URI:}

  ia:
    gemini-api-key: ${GEMINI_API_KEY:}
    modelo: gemini-3.5-flash-lite

    operacoes-sem-confirmacao:
      - consultarPedido
      - consultarProduto
      - consultarEstoque
      - consultarStatusNotaFiscal

    operacoes-com-confirmacao:
      - cadastrarProduto
      - cancelarPedido
      - emitirNotaFiscal
      - enviarDocumentoWhatsApp

  upload:
    diretorio: ${UPLOAD_DIRECTORY:uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:https://attentive-salvaging-frigidity.ngrok-free.dev}