spring:
  application:
    name: siscomercial-ecommerce

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# Perfil LOCAL - roda sem depender do Supabase, usando H2 em memória.
# Use este perfil para testar o backend e o agente de IA rapidamente.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:siscomercial;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Perfil SUPABASE - producao / homologacao
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

---
siscomercial:
  ia:
    gemini-api-key: ${GEMINI_API_KEY:}
    modelo: gemini-3.6-flash

    operacoes-sem-confirmacao:
      - consultarPedido
      - consultarProduto
      - consultarEstoque
      - consultarStatusNotaFiscal

    operacoes-com-confirmacao:
      - cadastrarProduto
      - cancelarPedido
      - emitirNotaFiscal
      - enviarDocumentoWhatsApp